name: Manual Screenshot Capture

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/manual-screenshot-capture.yml'
      - 'scripts/capture-manual-screenshots.mjs'
  workflow_dispatch:

# Temporary documentation-only workflow. Safe to remove after screenshot artifact upload.
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture live CRM screens
        env:
          CRM_URL: https://clean-lead-dream.lovable.app
          SCREENSHOT_DIR: manual-screenshots
        run: node scripts/capture-manual-screenshots.mjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gharpayy-crm-manual-screenshots
          path: manual-screenshots
          if-no-files-found: warn
          retention-days: 7
