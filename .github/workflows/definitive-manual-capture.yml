name: Definitive CRM Manual Capture

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/definitive-manual-capture.yml'
      - 'scripts/definitive-manual-capture.mjs'
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture definitive CRM manual evidence
        env:
          CRM_URL: https://clean-lead-dream.lovable.app
          SCREENSHOT_DIR: definitive-manual-capture
        run: node scripts/definitive-manual-capture.mjs
      - name: Upload documentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gharpayy-definitive-manual-capture
          path: definitive-manual-capture
          if-no-files-found: warn
          retention-days: 7
